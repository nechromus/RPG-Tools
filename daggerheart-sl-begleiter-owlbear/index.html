.ds-lvl { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: #fff; background: #6e6e6e; align-self: flex-start; padding: 1px 8px; border-radius: 3px; margin-top: 4px; }
.ds-card { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start; padding: 4px 0; border-bottom: 1px solid #ddd; }
.ds-box { width: 24px; height: 24px; margin-top: 1px; padding: 0; border: 2px solid #4a4a4a; border-radius: 3px; background: #fff; color: #1f3358; font-weight: 900; font-size: 16px; line-height: 1; cursor: pointer; }
.ds-box.on { border-color: #1f3358; }
.ds-box:disabled { border-style: dashed; cursor: default; }
.ds-name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.ds-name strong { text-transform: uppercase; font-weight: 900; font-size: 14px; letter-spacing: .02em; }
.ds-name span { font-size: 12px; color: #666; }
.ds-card.on .ds-name strong { color: #1f3358; }

.sa-input.center { text-align: center; padding: 0; } .sa-input.strong { font-weight: 700; }
.sa-input::placeholder { color: #b9c0cc; } @media print { .sa-input::placeholder { color: transparent; } }

/* ---- Bogen-Ansicht (fertige Charaktere) ---- */
.pcview { display: flex; flex-direction: column; gap: 12px; max-width: 960px; margin: 0 auto; width: 100%; }

.pv-ov { display: inline-flex; align-items: center; gap: 6px; }

}
/* Eingaben auf dem Bogen: keine App-Eingabefeld-Optik */

/* ---- Stufenaufstieg ---- */
.lu { display: flex; flex-direction: column; gap: 14px; max-width: 900px; margin: 0 auto; width: 100%; }

.lu-sec { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.lu-sec h3 { margin: 0; display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 20px; }
.lu-sec p { margin: 0; }
.lu-n { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 50%; background: var(--gold); color: #1a140a; font-family: var(--sans); font-size: 15px; font-weight: 800; flex: none; }

.lu-opt { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }

.lu-text { font-size: 14.5px; color: var(--text-2); }
.lu-boxes { display: inline-flex; gap: 4px; justify-content: flex-end; }
.lu-boxes.bold .lu-box { border-width: 3px; }
.lu-box { width: 24px; height: 24px; border: 2px solid var(--line-2); border-radius: 4px; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: var(--muted); }
.lu-box.new { border-color: var(--gold); background: var(--gold-bg); color: var(--gold-text); }
.lu-act { display: inline-flex; gap: 6px; }

@media (max-width: 600px) { .lu-opt { grid-template-columns: 1fr auto; } .lu-opt .lu-boxes { grid-column: 1 / -1; justify-content: flex-start; } }

@media (max-width: 700px) { .lu { padding: 0 12px; box-sizing: border-box; } .pv-bar .cs-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .lu-step { font-size: 22px; } }

/* ---- Ausrüstung, Karten, Rast ---- */

.gr-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }

@media (max-width: 700px) { .gr-row { grid-template-columns: 1fr; } .gr-act { justify-content: flex-start; } .cd-cols { grid-template-columns: 1fr; } }
.rest-moves summary { cursor: pointer; color: var(--gold-text); } .rest-moves p { margin: 4px 0; }
@media (max-width: 700px) { .pcview > .pv-bar { padding-left: 12px; padding-right: 12px; } }

.pv-entryhelp { margin: 0 0 6px; }

/* ---- Skizzen und Bilder ---- */

.pill.picture { background: #2c3340; color: #bcd2ee; }
.sk-wrap { border-radius: 10px; overflow: hidden; border: 1px solid #8a7a55; background: #e9e1c8; }

@media (max-width: 700px) { .pic-body { grid-template-columns: 1fr; } }
@media print { .sketch-show .sks-body { display: block; padding: 0; } .sketch-show .sk-svg.big { width: 100%; height: auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; } }

/* ---------- Spieltisch (Owlbear) ---------- */

.tblstatus.ready { color: var(--teal); border-color: #3f6a60; background: #1d2f2a; }

.tblbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; border: 1px dashed #3f6a60; border-radius: 12px; background: #172521; }

.tbl-title { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--teal); }

.tblbtn:hover { background: #24392f; }
.tblbtn.hid { border-style: dashed; color: var(--muted); background: none; }
.tblbtn.on { border-color: #4f7a6c; }
.tblbtn.icononly { width: 40px; justify-content: center; padding: 0; }
.tblgrp { display: inline-flex; gap: 4px; }

.tblrange.r-unmittelbar { color: var(--bad); border-color: #8a4a3e; background: #3b2420; }

.tblrange.r-kurz { color: var(--gold-text); border-color: var(--gold-line); }
.tblpc { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 4px 0 2px; }
.tblowner select { min-height: 40px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text); font: inherit; font-size: 14px; }
.playerview { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 16px; }
.playerview .card { max-width: 480px; width: 100%; }
.playerview h1 { margin: 0; font-family: var(--serif); }
.playerview p { margin: 0; color: var(--text-2); }
.plv-list { display: flex; flex-direction: column; gap: 6px; }
.plv-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
@media (max-width: 640px) { .tblbtn .tbl-l { display: none; } .tblbtn { width: 40px; justify-content: center; padding: 0; } }
/* Im schmalen Kampf-Bildschirm nur Symbole */
.cscreen .unit-row .tblbtn .tbl-l { display: none; }
.cscreen .unit-row .tblbtn { width: 40px; justify-content: center; padding: 0; }
.tblstatus-wrap { display: inline-flex; align-items: center; gap: 4px; }
@media (max-width: 640px) { .tblstatus .tbl-st { display: none; } }
.tblbar { flex-direction: column; align-items: stretch; }
.tblbar.muted { flex-direction: row; align-items: center; }
.tblrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tblmap { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; min-width: 0; }
.tblmap strong { color: var(--text); }
.scene > .tblbar { margin: 4px 0 6px; }
.log-show { display: flex; flex-direction: column; }
.log-text { flex: 1; margin: 0 10px 10px; padding: 10px; border-radius: 10px; border: 1px solid var(--line-2); background: #0e1411; color: var(--text-2); font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; overflow: auto; resize: none; }
button.tblstatus { cursor: pointer; }
.warnline { color: var(--warn); margin: 0; }

/* ---------- Spielende: kompakt mit Reitern ---------- */
.app.player { min-height: 100vh; }
.pvs { display: flex; flex-direction: column; min-height: 100vh; }
.pvs-pad { padding: 0 12px; }
.pvs-top { display: flex; align-items: center; gap: 6px; padding: 8px 10px 4px; }
.pvs-name { display: flex; flex-direction: column; min-width: 0; }
.pvs-name strong { font-family: var(--serif); font-size: 20px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pvs-mini { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 0 10px 6px; font-size: 13px; color: var(--muted); }

.pvs-total { font-size: 30px; line-height: 1; min-width: 44px; text-align: center; }
.pvs-lastt { display: flex; flex-direction: column; min-width: 0; }

.pvs-tabs { display: flex; gap: 4px; padding: 0 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
.pvs-tabs button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 40px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); font: inherit; font-weight: 700; font-size: 14px; }

.pvs-sec { display: flex; flex-direction: column; gap: 8px; }

/* Version und „Neu laden“: eigene Zeile unter den Schaltern (DH-032) */

/* ---------- G: Interaktionsfenster ---------- */

.ia-card.go { border-color: var(--gold); background: #1f1c14; }

.ia-card.pl.dock { margin: 0; border: 0; background: none; padding: 0; }
.ia-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ia-head b { font-size: 15px; }
.ia-pill { font-size: 12px; font-weight: 800; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
.ia-pill.go { border-color: var(--gold); color: var(--gold-text); }

.ia-steps { display: flex; gap: 3px; }
.ia-steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line-2); }
.ia-steps i.on { background: var(--gold); }
.ia-body { display: flex; flex-direction: column; gap: 7px; }
.ia-btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ia-btns.end { justify-content: flex-end; }
.ia-btns .grow { flex: 1; }
.ia-row2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.ia-f { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); min-width: 0; }
.ia-f.grow { flex: 1 1 160px; }
.ia-f input, .ia-f select { min-height: 36px; width: 100%; box-sizing: border-box; }
.ia-f input[type=number] { width: 80px; }
.ia-num { width: 76px; min-height: 38px; font-size: 18px; font-weight: 700; text-align: center; }

.ia-seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; align-self: flex-start; }
.ia-seg button { font: inherit; font-size: 13px; font-weight: 700; padding: 5px 12px; border: 0; border-right: 1px solid var(--line-2); background: var(--surface-2); color: var(--text); }
.ia-seg button:last-child { border-right: 0; }

.ia-traits button.on { border-color: var(--gold); color: var(--gold-text); background: #2a2214; }
.ia-roll { display: flex; align-items: center; gap: 10px; }
.ia-tot { font-family: var(--serif); font-size: 30px; line-height: 1; min-width: 42px; text-align: center; }
.ia-roll b.hope { color: var(--gold-text); } .ia-roll b.fear { color: var(--fear-text); } .ia-roll b.crit { color: var(--good); }
.okc { color: var(--good); } .badc { color: var(--bad); }
.ia-wait { margin: 0; }
.ia-check { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.ia-manual { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.pvs-pop.ia { padding-top: 12px; }
.inbox .ia-stack + .ib-more, .inbox .ia-stack + .ib-card { margin-top: 4px; }
.pinbar { flex-wrap: wrap; gap: 8px; align-items: center; }
.pinbar input { width: 110px; min-height: 36px; font-size: 18px; letter-spacing: .2em; text-align: center; }
/* G: Interaktionen als Overlay (SL von oben, Spielerin bildschirmfüllend); minimiert eine Leiste */
.ia-overlay { z-index: 75; }
.ia-overlay.gm:not(.min) { position: fixed; left: 0; right: 0; top: 0; max-height: 88vh; overflow: auto; display: flex; flex-direction: column; gap: 8px;
  padding: calc(8px + var(--sat)) max(10px, var(--sar)) 12px max(10px, var(--sal)); background: var(--bg-2, #141c18); border-bottom: 2px solid var(--gold); box-shadow: 0 12px 40px rgba(0,0,0,.6); }
@keyframes ia-down { from { transform: translateY(-100%); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .ia-overlay.gm:not(.min) { animation: none; } }
.ia-overlay.min { position: relative; margin: 4px 8px; padding: 4px 8px 4px 4px; border-radius: 10px; border: 1px solid var(--gold); background: #1f1c14; }
.ia-ovbar { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ia-ovbar b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ia-ovsum { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.ia-minbtn { flex: 0 0 auto; }
.ia-overlay.gm .ia-card { box-shadow: none; }
.ia-overlay.pl:not(.min) { position: fixed; inset: 0; margin: 0; border-radius: 0; border: 0; overflow: auto; padding: calc(10px + var(--sat)) max(14px, var(--sar)) calc(14px + var(--sab)) max(14px, var(--sal)); background: var(--bg); gap: 12px; }
.ia-overlay.pl.go:not(.min) { background: #17140d; box-shadow: inset 0 0 0 3px var(--gold); }
.ia-overlay.pl:not(.min) .ia-head b { font-family: var(--serif); font-size: 20px; }
.ia-overlay.pl:not(.min) .btn.big { min-height: 58px; }
.ur-attack { min-height: 40px; white-space: nowrap; }
.pvs-takebtn { align-self: flex-start; }
.pvs-take-intro { display: flex; flex-direction: column; gap: 3px; }
.pvs-take-row input[name=dmg] { width: 96px; min-height: 40px; font-size: 17px; }
.iatoggle { position: relative; }
.iatoggle.on { border-color: var(--gold); color: var(--gold-text); }
.iatoggle .nb-count { position: absolute; top: -4px; right: -4px; }
.ia-new { box-shadow: none; }
.ia-new select { min-height: 34px; max-width: 200px; }
.ia-stp { display: inline-flex; align-items: center; gap: 6px; }
.ia-stp b { min-width: 22px; text-align: center; font-size: 18px; color: var(--text); }
.ia-whatnow { display: flex; flex-direction: column; gap: 4px; padding: 7px 9px; border-radius: 9px; background: var(--surface-2); border-left: 3px solid var(--gold); }
.ia-whatnow b { font-family: var(--serif); font-size: 16px; }
/* H: Spielmodi */
.modebar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px max(10px, var(--sar)) 6px max(10px, var(--sal)); background: var(--bg-2, #141c18); border-bottom: 1px solid #2a3832; }
.mode-seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; }
.mode-seg button { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 11px; border: 0; border-right: 1px solid var(--line-2); background: var(--surface); color: var(--muted); }
.mode-seg button:last-child { border-right: 0; }
.mode-seg button.on { background: var(--gold); color: #1a140a; }
.focusctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.focus-pill { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: #1f1c14; color: var(--gold-text); border: 1px solid var(--gold); }
.focus-pill.gm { background: #3a1814; color: #f0a593; border-color: #a1432f; }
.focus-back { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.scene-mode { display: inline-flex; align-items: center; gap: 6px; }
.scene-mode select { min-height: 32px; padding-left: 8px; font-size: 14px; }
.spotchip.behind { border-color: #c48a2a; }
.gmoptions, .gmrest { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid #a1432f; background: #1f1513; }
.gmrest { border-color: var(--gold); background: #1f1c14; }
.go-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.go-head b { font-family: var(--serif); font-size: 18px; }
.go-head .grow { flex: 1; }
.go-card { display: flex; flex-direction: column; gap: 5px; padding: 7px 9px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line-2); }
.go-title { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.go-units { display: flex; flex-wrap: wrap; gap: 5px; }
.go-feat { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; }
.go-feat .grow { flex: 1; }
.restlog { display: flex; flex-direction: column; gap: 2px; }
.pvs-mode { font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
.pvs-mode.gm { border-color: #a1432f; color: #f0a593; }
.pvs-gmturn { display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; border-radius: 10px; background: #2a1613; border: 1.5px solid #a1432f; }
.pvs-sec.gm-turn .pvs-weapon, .pvs-sec.gm-turn .pvs-traits, .pvs-sec.gm-turn .pvs-target { opacity: .45; }
.pvs-askbtn.big { align-self: stretch; }
.pvs-resth { font-family: var(--serif); font-size: 18px; }
.pvs-restmove { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text); }
.pvs-restmove.on { border-color: var(--gold); background: #2a2214; }
.pvs-sname { flex-shrink: 0; max-width: 45%; }
@media (max-width: 640px) { html.in-owlbear .topbar .tblstatus { display: none; } }

/* ---------- Startseite (Spielen / Ansehen) ---------- */
.home { flex: 1; display: flex; justify-content: center; padding: 28px max(16px, var(--sar)) calc(40px + var(--sab)) max(16px, var(--sal)); }
.home-wrap { width: 100%; max-width: 620px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.home-hero { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
.home-hero h1 { font-size: 30px; line-height: 1.15; text-wrap: balance; }
.home-hero p { margin: 4px 0 0; }
.home-back { align-self: flex-start; }
.home-modes, .home-list { display: flex; flex-direction: column; gap: 10px; }
.home-mode, .home-item, .home-continue { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font: inherit; cursor: pointer; }
.home-mode { padding: 18px; min-height: 96px; }
.home-mode:hover, .home-item:hover { border-color: var(--line-2); background: var(--surface-2); }
.home-mode > svg, .home-item > svg { color: var(--muted); flex: none; }
.hm-icon { flex: none; width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--gold-bg); border: 1px solid var(--gold-line); color: var(--gold); }
.hm-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.hm-text b { font-family: var(--serif); font-size: 20px; }
.hm-text span { color: var(--text-2); font-size: 14px; }
.hm-text .eyebrow { color: var(--gold); font-size: 11px; }
.home-continue { padding: 16px 18px; background: var(--gold-bg); border-color: var(--gold-line); }
.home-continue:hover { border-color: var(--gold); }
.home-continue .hm-icon { background: var(--gold); color: var(--bg); border-color: var(--gold); }
.home-item { padding: 12px 16px; min-height: 60px; }
.home-item.last { border-color: var(--gold-line); }
.hi-main { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.hi-main b { font-size: 17px; }
.hi-tag { flex: none; font-size: 12px; color: var(--gold-text); border: 1px solid var(--gold-line); border-radius: 999px; padding: 2px 8px; }
.home-sub { margin-top: 6px; }
.home-more { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.home-new { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.home-new input { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--text); font: inherit; }
@media (max-width: 480px) { .hi-tag { display: none; } .home-hero h1 { font-size: 26px; } }

/* Lesemodus-Leiste */
.readbar { position: sticky; top: var(--hdr); z-index: 25; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 6px max(16px, var(--sar)) 6px max(16px, var(--sal)); background: #1b2230; border-bottom: 1px solid #34405a; }
.rb-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #a9c1ee; font-weight: 700; }
.rb-group { display: inline-flex; align-items: center; gap: 6px; }
.rb-group select { min-height: 36px; max-width: 60vw; border-radius: 8px; border: 1px solid #34405a; background: var(--bg-2); color: var(--text); padding: 0 8px; font: inherit; font-size: 14px; }
@media (max-width: 640px) { .rb-hint { display: none; } }
.gv-readnote { border: 1px dashed #34405a; border-radius: 10px; padding: 10px 12px; margin: 0; }
.readbar .btn { min-height: 36px; }
@media (max-width: 480px) { .rb-home-l { display: none; } .readbar .rb-home { padding: 0 10px; } .rb-group select { max-width: 52vw; } }

/* ---------- Farbstimmung je Spielmodus ----------
   SL: der ganze Bildschirm leicht getönt. Spielende: farbiges Kopfband (pvs-band).
   Gold für Vorlesetexte und Akzente bleibt überall gleich. */
:root { --mode: var(--gold); --mode-ink: #1a140a; }
:root[data-mode="erzaehlen"] { --bg: #18170f; --bg-2: #1e1c13; --surface: #23211a; --surface-2: #2c2a1f; --line: #3c3828; --line-2: #4b4632; --mode: #e3ac52; --mode-ink: #1a1408; }
:root[data-mode="erkunden"] { --bg: #0f1b16; --bg-2: #13231c; --surface: #182a22; --surface-2: #1f342a; --line: #2b4a3c; --line-2: #39594a; --mode: #7fc8a0; --mode-ink: #0c1a12; }
:root[data-mode="kampf"] { --bg: #1b1110; --bg-2: #221513; --surface: #281a17; --surface-2: #32211d; --line: #4a2c26; --line-2: #5a3830; --mode: #e8735a; --mode-ink: #1e0b07; }
:root[data-mode="auszeit"] { --bg: #11151d; --bg-2: #151a25; --surface: #1a202c; --surface-2: #222937; --line: #313b50; --line-2: #3f4a62; --mode: #9db4f0; --mode-ink: #0c1222; }
:root[data-mode] body, :root[data-mode] .app { background: var(--bg); transition: background-color .4s ease; }
:root[data-mode] .topbar, :root[data-mode] .modebar { border-bottom-color: var(--line); }
:root[data-mode] .topbar { box-shadow: inset 0 -2px 0 var(--mode); }
:root[data-mode] .mode-seg button.on { background: var(--mode); color: var(--mode-ink); }
@media (prefers-reduced-motion: reduce) { :root[data-mode] .app { transition: none; } }

.pvs-band { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; padding: calc(8px + var(--sat)) max(12px, var(--sar)) 8px max(12px, var(--sal)); background: var(--mode); color: var(--mode-ink); }
.pvs-band b { font-family: var(--serif); font-size: 18px; }
.pvs-band span { font-size: 13px; font-weight: 600; }
.pvs-band.gm { background: #7a2f22; color: #ffe2da; }
/* Tisch-Leiste in der Stimmung (Status-Farben wie „Tisch ✓“ bleiben) */
:root[data-mode] .tblbar { border-color: var(--line-2); background: var(--surface); }
:root[data-mode] .tblbar.muted { background: none; }
:root[data-mode] .tbl-title { color: var(--mode); }
:root[data-mode] .tblbtn { border-color: var(--line-2); background: var(--surface-2); color: var(--text); }

/* ---------- Bühne (Vorschau für die SL) ---------- */
.stagecard { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; margin: 4px 0 14px; }
.sc-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; width: 100%; padding: 10px 14px; background: none; border: 0; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.sc-head b { font-family: var(--serif); font-size: 17px; }
.sc-chev { display: inline-flex; transform: rotate(90deg); transition: transform .15s; color: var(--muted); align-self: center; }
.sc-chev.on { transform: rotate(-90deg); }
.sc-img { display: block; width: 100%; padding: 0 14px 14px; background: none; border: 0; cursor: zoom-in; }
.sc-img img { display: block; width: 100%; max-height: 300px; object-fit: contain; border-radius: 6px; background: #ece2cb; }
.stage-show { display: flex; align-items: center; justify-content: center; background: rgba(8, 10, 9, .92); padding: 16px; cursor: zoom-out; }
.stage-show img { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.stage-x { position: absolute; top: calc(12px + var(--sat)); right: max(12px, var(--sar)); }
/* Start: verbinden, Daten holen */
.sync-lines { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.sync-line { display: flex; align-items: center; gap: 8px; color: var(--text-2); }
.sync-line.ok svg { color: var(--good); }
.sync-line.err { color: var(--bad); }
.home-grow { display: flex; flex-direction: column; gap: 0; }
.home-newer { display: flex; align-items: center; gap: 6px; margin: -6px 10px 0; padding: 8px 12px; border: 1px solid var(--gold-line); border-top: 0; border-radius: 0 0 10px 10px; background: var(--gold-bg); color: var(--gold-text); font: inherit; font-size: 13px; font-weight: 600; text-align: left; cursor: pointer; }
.warnline { color: var(--warn); }
.home-manage { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.hm-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hm-row .hi-main { flex: 1 1 200px; }
.menu-item .menu-hint { display: block; margin-left: auto; padding-left: 10px; font-size: 12px; font-weight: 400; color: var(--muted); white-space: nowrap; }

/* Owlbear-Vollbild am Handy: leicht durchscheinend, die Karte ist dahinter nur zu ahnen */
/* color-scheme am Wurzelelement „normal“: sonst malt der Browser ein deckendes Fenster (anderes Farbschema als Owlbear) */
html.see-through, html.mini-view { color-scheme: normal; }
html.see-through body, html.mini-view body { color-scheme: dark; }
html.see-through { background: transparent; }
html.see-through body { background: color-mix(in srgb, var(--bg) 86%, transparent); }
/* Mini-Knopf (Vollbild zur Karte verkleinert) */
html.mini-view, html.mini-view body { background: transparent; overflow: hidden; }
.mini-btn { position: fixed; inset: 4px; border-radius: 50%; border: 2px solid var(--gold, #d9a441); background: color-mix(in srgb, var(--bg) 82%, transparent);
  color: var(--gold, #d9a441); display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.45); padding: 0; }
.mini-btn:active { transform: scale(.94); }
/* Karten-Knopf mitten in der Reiterleiste – auf der Karte liegt der App-Knopf an derselben Stelle */
.pvs-tab-map { flex: 0 0 auto !important; border: 0 !important; background: none; padding: 0 6px; color: var(--gold) !important; position: relative; }
.pvs-tab-map .tm-ring { display: grid; place-items: center; width: 54px; height: 54px; margin-top: -22px; border-radius: 50%; border: 2px solid var(--gold); background: var(--bg); box-shadow: 0 -2px 10px rgba(0,0,0,.35); }
.pvs-tab-map:active .tm-ring { transform: scale(.94); }
/* Würfe der anderen: Zähler am Reiter, Ergebnis-Streifen */
.pvs-badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: #e86a5a; color: #fff; font-size: 11px; font-weight: 800; }
.pvs-strips { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px 0; }
.pvs-strip { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; border-radius: 10px; padding: 7px 12px; font: inherit; font-size: 14px; line-height: 1.3; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--line-2); color: var(--text); animation: strip-in .25s ease-out; }
.pvs-strip .n { font-size: 22px; font-weight: 800; color: var(--text); min-width: 1.4em; text-align: center; }
.pvs-strip.hope { background: color-mix(in srgb, var(--gold) 14%, var(--surface)); border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
.pvs-strip.hope .n, .pvs-strip.crit .n { color: var(--gold-text, var(--gold)); }
.pvs-strip.fear { background: color-mix(in srgb, #9b7bd8 16%, var(--surface)); border-color: color-mix(in srgb, #9b7bd8 50%, transparent); }
.pvs-strip.fear .n { color: #c8a8f0; }
.pvs-strip.crit { background: color-mix(in srgb, var(--gold) 22%, var(--surface)); border-color: var(--gold); box-shadow: 0 0 14px color-mix(in srgb, var(--gold) 45%, transparent); }
@keyframes strip-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
/* Mini-Knopf: kurz als Pille mit dem Wurf der anderen; leuchtet und wackelt, wenn in der App etwas wartet */
.mini-btn .mini-txt { display: none; font: 600 14px/1.2 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
html.mini-pill .mini-btn { border-radius: 999px; justify-content: flex-start; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 12px; }
html.mini-pill .mini-btn svg { flex: none; width: 24px; height: 24px; }
html.mini-pill .mini-btn .mini-txt { display: block; color: var(--text); }
.mini-btn[data-tone="fear"] { border-color: #b493e6; }
.mini-btn[data-tone="crit"] { box-shadow: 0 0 14px rgba(227,172,82,.7); }
.mini-btn.need { inset: 7px; border-width: 3px; border-color: #ffcf73; color: #ffcf73; animation: mini-glow 1.6s ease-in-out infinite, mini-wiggle 2.4s ease-in-out infinite; }
.mini-btn.need::after { content: ""; position: absolute; top: 2px; right: 2px; width: 13px; height: 13px; border-radius: 50%; background: #e86a5a; border: 2px solid var(--bg); }
@keyframes mini-glow { 0%, 100% { box-shadow: 0 0 3px rgba(255,207,115,.5); } 50% { box-shadow: 0 0 7px 2px rgba(255,207,115,.95); } } /* passt ins 64-px-Fenster */
@keyframes mini-wiggle { 0%, 70%, 100% { transform: rotate(0); } 76% { transform: rotate(-12deg); } 82% { transform: rotate(10deg); } 88% { transform: rotate(-7deg); } 94% { transform: rotate(4deg); } }
@media (prefers-reduced-motion: reduce) { .mini-btn.need { animation: mini-glow 1.6s ease-in-out infinite; } }

/* Verlauf in der Interaktion (DH-072): Schritte von oben nach unten, Pfeile, Faltzeile */
.ia-trail { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ia-trail > li { display: block; min-width: 0; }
.ia-st { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 7px; align-items: start; width: 100%; text-align: left; font: inherit; font-size: 13px; line-height: 1.3;
  padding: 5px 8px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); color: var(--text); }
.ia-st:disabled { cursor: default; opacity: 1; }
.ia-st[aria-expanded] { cursor: pointer; }
.ia-st .who { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 800; }
.ia-st.gm .who { background: var(--gold-bg); color: var(--gold-text); border: 1px solid var(--gold-line); }
.ia-st.pl .who { background: #1c2b27; color: var(--teal); border: 1px solid #2f5a52; }
.ia-st .t { min-width: 0; overflow-wrap: anywhere; } .ia-st .t > span { color: var(--muted); }
.ia-st .t .det { display: block; margin-top: 2px; font-size: 12px; color: var(--text-2); }
.ia-st .n { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 15px; white-space: nowrap; }
.ia-st .n.h, .ia-st .n.c { color: var(--gold-text); } .ia-st .n.f { color: var(--fear-text); } .ia-st .n.ok { color: var(--good); } .ia-st .n.no { color: var(--bad); }
.ia-arr { height: 12px; padding-left: 19px; }
.ia-arr i { position: relative; display: block; width: 2px; height: 100%; background: var(--line-2); }
.ia-arr i::after { content: ""; position: absolute; left: -4px; bottom: -1px; border: 5px solid transparent; border-top: 6px solid var(--line-2); border-bottom: 0; }
.ia-arr.go i { background: var(--gold); } .ia-arr.go i::after { border-top-color: var(--gold); }
.ia-fold { width: 100%; font: inherit; font-size: 12px; color: var(--muted); padding: 5px 8px; border: 1px dashed var(--line-2); border-radius: 9px; background: none; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Schnellmenü am Charakter-Chip (DH-060) */
.chipmenu { flex-basis: 100%; display: flex; flex-direction: column; gap: 2px; margin-top: 4px; padding: 6px; border-radius: 12px; border: 1px solid var(--gold-line); background: var(--surface-2); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.chipmenu .cm-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px 6px; }
.chipmenu .cm-head b { font-family: var(--serif); font-size: 15px; }
.cm-item { display: flex; align-items: center; min-height: 40px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--text); font: inherit; font-size: 14px; font-weight: 600; text-align: left; }
.cm-item:hover, .cm-item:focus-visible { background: var(--gold-bg); color: var(--gold-text); }
.cm-sep { border: 0; border-top: 1px solid var(--line); margin: 3px 6px; }
.cm-sub { display: flex; flex-direction: column; gap: 8px; padding: 2px 6px 6px; }
.ia-dmgtab { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.ia-dmgtab th, .ia-dmgtab td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
.ia-dmgtab th { color: var(--muted); font-weight: 600; }
.spotrow { flex-wrap: wrap; }
/* Verbrauchsgüter im Spieler-Bogen (DH-066) */
.pvs-cons { display: flex; flex-direction: column; gap: 6px; }
.pvs-consrow { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.pvs-used { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border: 1px solid var(--gold-line); border-radius: 10px; background: var(--gold-bg); }
.pvs-notice { margin: 6px 8px 0; padding: 8px 12px; border-radius: 10px; background: #1c2b27; border: 1px solid #2f5a52; color: var(--teal); font-weight: 600; font-size: 14px; }
/* Spieleraktionen II (WP-06) */
.ia-price { display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px dashed var(--gold-line); border-radius: 10px; }
.pvs-help { display: flex; flex-direction: column; gap: 6px; margin: 6px 8px 0; }
.pvs-helprow { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line-2); font-size: 14px; }
.ia-death { gap: 6px; }
.ia-move { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text); font: inherit; }
.ia-move:hover, .ia-move:focus-visible { border-color: var(--gold); }
.cm-sub .ia-f.grow { flex: none; }
/* DH-064 Teamwurf-Start */
.pvs-team { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0; }
.pvs-team.open { flex-direction: column; align-items: stretch; padding: 8px; border: 1px solid var(--line, #444); border-radius: 10px; }
.pvs-team.open .ia-f { flex: none; }
.ia-move .small.hope { color: var(--gold); } .ia-move .small.fear { color: #b58cff; } .ia-move .small.crit { color: var(--gold); font-weight: 700; }
/* DH-078 Einladen */
.inv-wrap { position: fixed; inset: 0; z-index: 80; background: #000a; display: flex; align-items: flex-start; justify-content: center; padding: 12px; overflow: auto; }
.inv-card { width: min(380px, 100%); background: var(--panel, #1f1d17); border: 1px solid var(--line, #3a372e); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.inv-head { display: flex; align-items: center; gap: 6px; }
.inv-main { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.inv-qr { background: #fff; border-radius: 8px; image-rendering: pixelated; max-width: 100%; height: auto; }
.inv-link, .inv-code { width: 100%; font: 12px ui-monospace, monospace; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line, #3a372e); background: #0003; color: inherit; word-break: break-all; }
.inv-code { display: block; }
.inv-check { display: flex; flex-direction: column; gap: 6px; }
.ia-btns.center { justify-content: center; }
.inv-more textarea { width: 100%; margin-top: 6px; font: inherit; font-size: 13px; padding: 6px; border-radius: 6px; border: 1px solid var(--line, #3a372e); background: #0003; color: inherit; }
.inv-big { position: fixed; inset: 0; z-index: 90; background: #fff; color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font-size: 14px; }
.inv-new { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
.inv-newrow { border: 1px solid var(--gold, #e8b04f); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
