<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16211c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SL-Begleiter">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Daggerheart SL-Begleiter</title>
<style>:root {
  --bg: #121a16;
  --bg-2: #16211c;
  --surface: #1a2621;
  --surface-2: #22302a;
  --line: #2c3d35;
  --line-2: #3a4a42;
  --text: #ece6d6;
  --text-2: #d7dccf;
  --muted: #a9b3a6;
  --gold: #e3ac52;
  --gold-text: #f2c77c;
  --gold-bg: #1f1c14;
  --gold-line: #5c4a2c;
  --teal: #8fd0c4;
  --fear: #9b7fd1;
  --fear-text: #c3adf0;
  --hp: #d8674f;
  --hp-off: #7a4038;
  --stress: #5fb3a8;
  --stress-off: #3c6a62;
  --good: #b7dc9a;
  --warn: #f0b98a;
  --bad: #f0a593;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
  /* Sichere Ränder (iPad/iPhone: Statusleiste, Kamera, Home-Balken) */
  --sat: env(safe-area-inset-top, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --hdr: calc(64px + var(--sat)); /* wird per Skript auf die echte Höhe gesetzt */
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.45; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--serif); }
h1 { font-size: 34px; line-height: 1.15; }
h3 { font-size: 19px; }
code { background: var(--surface-2); padding: 1px 6px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.grow { flex: 1 1 auto; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.accent { color: var(--gold); }
.ic { display: inline-flex; flex-shrink: 0; }
.eyebrow { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.eyebrow.accent { color: var(--gold); }

/* ---------- Buttons & Chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text); font-weight: 600; text-align: left; }
.btn:hover { border-color: #56685e; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #1a140a; }
.btn.primary:hover { background: #f0bd6a; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.icon { width: 44px; padding: 0; }
.btn.icon.sm { width: 36px; min-height: 36px; border-radius: 8px; }
.small-btn { min-height: 40px; margin-top: 8px; }
.linkbtn { display: inline-flex; align-items: center; gap: 4px; margin-left: 6px; padding: 2px 4px; border: 0; background: none; color: var(--gold); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.pill.gold { background: var(--gold); color: #1a140a; }
.pill.teal { background: #2a3f38; color: var(--teal); }
.pill.red { background: #3b2420; color: var(--bad); }
.pill.tiny { font-size: 10px; padding: 2px 6px; letter-spacing: .04em; }
.chip { display: inline-flex; align-items: center; padding: 5px 12px; border-radius: 8px; background: var(--surface-2); font-weight: 700; font-size: 15px; white-space: nowrap; }
.chev { display: inline-flex; color: var(--muted); transition: transform .15s; }
.chev.open { transform: rotate(90deg); }
.card { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 18px; display: flex; flex-direction: column; gap: 12px; }

/* ---------- Grundlayout ---------- */
.app { min-height: 100dvh; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px; min-height: calc(64px + var(--sat)); padding: calc(8px + var(--sat)) max(20px, var(--sar)) 8px max(20px, var(--sal)); background: var(--bg-2); border-bottom: 1px solid #2a3832; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand-title { font-family: var(--serif); font-weight: 700; font-size: 21px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topscene { display: none; color: var(--muted); }

.fear { display: flex; align-items: center; gap: 6px; }
.fear-label { font-size: 13px; color: var(--muted); }
.fdots { display: flex; }
.fdot { width: 22px; height: 36px; padding: 0; border: 0; background: none; display: inline-flex; align-items: center; justify-content: center; }
.fdot span { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #4a5a52; }
.fdot.on span { background: var(--fear); border-color: var(--fear); }
.fear-val { min-width: 26px; text-align: center; font-family: var(--serif); font-weight: 700; font-size: 22px; color: var(--fear-text); }

.menu { position: relative; }
.menu summary { list-style: none; }
.menu summary::-webkit-details-marker { display: none; }
.menu-pop { position: absolute; right: 0; top: calc(100% + 8px); width: 290px; padding: 8px; border-radius: 12px; border: 1px solid var(--line-2); background: #18241f; box-shadow: 0 16px 40px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 2px; z-index: 50; }
.menu-pop .eyebrow { padding: 8px 10px 4px; }
.menu-item { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border: 0; border-radius: 8px; background: none; text-align: left; }
.menu-item:hover { background: var(--surface-2); }
.menu-item.current { color: var(--gold); }
.menu-item.danger { color: var(--bad); }

.body { flex: 1; display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; height: calc(100dvh - var(--hdr)); }
.nav, .main, .side { overflow-y: auto; }
.nav { border-right: 1px solid #2a3832; padding: 18px 12px 40px; display: flex; flex-direction: column; gap: 18px; }
.nav-act { display: flex; flex-direction: column; gap: 2px; }
.nav-act .eyebrow { padding: 0 10px 4px; }
.nav-row { display: flex; align-items: stretch; gap: 4px; border-radius: 8px; }
.nav-row:hover { background: #1d2a24; }
.nav-row.current { background: #24332c; }
.nav-item { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: #c9cfc4; text-align: left; }
.nav-item span:first-child { flex: 1; }
.nav-row.current .nav-item { color: var(--text); font-weight: 700; }
.navfight { flex-shrink: 0; align-self: center; display: inline-flex; align-items: center; gap: 4px; min-height: 34px; margin-right: 4px; padding: 0 9px; border-radius: 999px; border: 1px solid #8a4a3e; background: #3b2420; color: var(--bad); font-size: 12px; font-weight: 700; letter-spacing: .03em; }
.navfight:hover { background: #4a2a24; color: #ffc2b4; }
.title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.title-row h1 { flex: 1 1 auto; }
.btn.fightbtn { border-color: #8a4a3e; background: #3b2420; color: var(--bad); }
.btn.fightbtn:hover { background: #4a2a24; color: #ffc2b4; }
/* Szenenliste eingeklappt (ab Tablet-Breite) */
.navbtn { display: inline-flex; }
@media (min-width: 861px) {
  .nav-collapsed .nav, .nav-collapsed .scrim { display: none; }
  .nav-collapsed .body { grid-template-columns: minmax(0, 1fr) 300px; }
}
@media (min-width: 861px) and (max-width: 1180px) {
  .nav-collapsed .body { grid-template-columns: minmax(0, 1fr); }
  .nav-collapsed .side { grid-column: 1; }
}
.donemark { color: var(--teal); display: inline-flex; }
.scrim { display: none; }
.main { padding: 28px 36px 60px; }
.nav { padding-left: max(12px, var(--sal)); }
.side { padding-right: max(18px, var(--sar)); }
.side { border-left: 1px solid #2a3832; background: #141e19; padding: 20px 18px 40px; display: flex; flex-direction: column; gap: 22px; }

/* ---------- Szene ---------- */
.scene { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.scene-head { display: flex; flex-direction: column; gap: 4px; }
.prose p { margin: 0 0 .7em; }
.prose p:last-child { margin-bottom: 0; }
.prose.small { font-size: 14px; color: var(--text-2); }

.readaloud { border: 1px solid var(--gold-line); border-radius: 14px; background: var(--gold-bg); padding: 6px 22px 6px; }
.readaloud.done { border-color: #3d3524; opacity: .82; }
.ra-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ra-toggle { flex: 1 1 260px; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0; border: 0; background: none; text-align: left; }
.ra-title { flex: 1; font-family: var(--serif); font-weight: 700; font-size: 19px; }
.readmark { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px dashed #6b5527; background: none; color: var(--muted); font-size: 13px; }
.readmark.on { border-style: solid; border-color: #4f7a6c; color: #9fe0cf; background: #1c2e28; }
.readtext { padding: 4px 0 18px; font-family: var(--serif); font-size: 20px; line-height: 1.6; color: #f1e9d4; }

.gmnote { display: flex; gap: 14px; align-items: flex-start; padding: 14px 18px; border-radius: 12px; background: #182420; border: 1px solid var(--line); }
.gmlabel { flex-shrink: 0; margin-top: 2px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.gmnote.q .gmlabel { color: var(--teal); }
.gmnote .prose { color: var(--text-2); }

.decision { background: #16201b; }
.decision-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.outcomes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.outcome { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 10px; text-align: left; border: 1px solid; min-height: 44px; transition: opacity .15s; }
.outcome.wide { grid-column: 1 / -1; }
.outcome-label { display: flex; align-items: center; gap: 4px; font-weight: 700; }
.outcome-text { color: var(--text-2); line-height: 1.45; }
.fearnote { font-weight: 500; color: var(--fear-text); }
.pickmark { margin-left: auto; display: inline-flex; }
.outcome.good { background: #1f2b20; border-color: #3c5a3a; } .outcome.good .outcome-label { color: var(--good); }
.outcome.warn { background: #2a2219; border-color: #5a4630; } .outcome.warn .outcome-label { color: var(--warn); }
.outcome.bad { background: #2c1d1c; border-color: #6a3a34; } .outcome.bad .outcome-label { color: var(--bad); }
.outcome.crit { background: #2a2414; border-color: #6b5527; } .outcome.crit .outcome-label { color: var(--gold-text); }
.outcome.neutral { background: var(--surface-2); border-color: var(--line-2); }
.outcome.picked { box-shadow: 0 0 0 2px var(--gold); }
.outcome.dim { opacity: .45; }

.branches ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: var(--text-2); }
.info-toggle { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0; border: 0; background: none; text-align: left; }
.npcgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.npc { padding: 14px; gap: 6px; }
.section-title { margin-bottom: 10px; }

.statcard-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.statgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; }
.stat { padding: 8px 4px; border-radius: 10px; background: var(--surface-2); display: flex; flex-direction: column; }
.stat span { font-size: 12px; color: var(--muted); }
.stat strong { font-size: 20px; }
.weapon { padding: 10px 14px; border-radius: 10px; background: #182420; }
.dmg { color: var(--gold-text); }
.features { display: flex; flex-direction: column; gap: 8px; }
.feature { padding: 10px 14px; border-radius: 10px; border: 1px solid #3a3424; background: #1a1812; }
.feature-head strong { color: var(--gold-text); }
.feature-text { margin-top: 4px; color: var(--text-2); font-size: 15px; }
.fearcost { margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: #2a2140; color: var(--fear-text); font-size: 12px; font-weight: 700; }

.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

/* ---------- Kampf ---------- */
.combat { display: flex; flex-direction: column; gap: 12px; padding-top: 6px; }
.combat-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.units { display: flex; flex-direction: column; gap: 10px; }
.unit { border-radius: 14px; border: 1px solid var(--line); background: #16201b; }
.unit.open { border-color: #4a5f55; background: var(--surface); }
.unit.down { opacity: .55; }
.unit.acted .unit-title strong { color: var(--muted); }
.unit-head { display: flex; align-items: center; gap: 12px; padding: 8px 12px; flex-wrap: wrap; }
.unit-name { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 4px; border: 0; background: none; text-align: left; }
.unit-title { display: flex; flex-direction: column; }
.unit-title strong { font-family: var(--serif); font-size: 19px; }
.tracks { display: flex; gap: 14px; flex-wrap: wrap; }
.track { display: flex; align-items: center; }
.tlabel { font-size: 12px; color: var(--muted); margin-right: 4px; min-width: 18px; }
.pip { width: 34px; height: 40px; padding: 0; border: 0; background: none; display: inline-flex; align-items: center; justify-content: center; }
.pip span { width: 24px; height: 24px; border: 2px solid; }
.pip.hp span { border-radius: 5px; border-color: var(--hp-off); }
.pip.hp.on span { background: var(--hp); border-color: var(--hp); }
.pip.stress span { border-radius: 50%; border-color: var(--stress-off); }
.pip.stress.on span { background: var(--stress); border-color: var(--stress); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.cond { padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; border: 1px solid; }
.c0 { color: var(--gold-text); background: #3a2e14; border-color: #8a6a2c; }
.c1 { color: #9fc7f2; background: #18283a; border-color: #3c6290; }
.c2 { color: #c9cfc4; background: #262c29; border-color: #56625b; }
.custom { color: var(--fear-text); background: #2a2140; border-color: #6a52a0; }
.cond.down { color: var(--bad); background: #3b2420; border-color: #8a4a3e; }
.actbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: none; color: #c9cfc4; font-weight: 700; white-space: nowrap; }
.actbtn.on { background: #2a3f38; border-color: #4f7a6c; color: #9fe0cf; }

.unit-body { border-top: 1px solid var(--line); padding: 16px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; }
.unit-body .col { display: flex; flex-direction: column; gap: 12px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.dmgbtns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
button.dmg { min-height: 58px; border-radius: 10px; border: 1px solid; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text); }
button.dmg span { font-size: 13px; color: #c9cfc4; }
.dmg.minor { background: #2a2219; border-color: #5a4630; }
.dmg.major { background: #2d2019; border-color: #6a4a34; }
.dmg.severe { background: #321c1a; border-color: #7a3a34; }
.dmgform, .condform { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dmgform label { font-size: 14px; color: var(--muted); }
.dmgform input { width: 96px; }
.condform input { flex: 1 1 180px; }
input[type=text], input[type=number], textarea { min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: #101713; }
textarea { width: 100%; resize: vertical; line-height: 1.45; }
.condbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.condbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 999px; font-weight: 700; border: 1.5px dashed var(--line-2); background: none; color: var(--muted); }
.condbtn.on { border-style: solid; }
.condbtn.on.c0 { color: var(--gold-text); background: #3a2e14; border-color: #8a6a2c; }
.condbtn.on.c1 { color: #9fc7f2; background: #18283a; border-color: #3c6290; }
.condbtn.on.c2 { color: #c9cfc4; background: #262c29; border-color: #56625b; }
.condbtn.on.custom { color: var(--fear-text); background: #2a2140; border-color: #6a52a0; }
.spawnrow { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Seitenleiste ---------- */
.side-sec { display: flex; flex-direction: column; gap: 8px; }
.pctable { width: 100%; border-collapse: collapse; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.pctable th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: left; padding: 8px 10px; background: #18241f; }
.pctable td { padding: 8px 10px; border-top: 1px solid #22302a; }
.pctable .num { font-weight: 700; text-align: right; }
.pctable th:not(:first-child) { text-align: right; }
.sec-head { display: flex; align-items: center; gap: 8px; }
.row { display: inline-flex; align-items: center; gap: 6px; }
.row.gap { display: flex; gap: 8px; }
.btn.compact { min-height: 36px; padding: 0 10px; font-size: 14px; }
.party-editor p { margin: 0; }
.pc-edit { margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 12px; color: var(--muted); }
.field input { width: 100%; min-width: 0; }
.pc-edit .rm { grid-column: 1 / -1; justify-self: start; }
.quickref { font-size: 14px; color: var(--text-2); }
.quickref strong { color: var(--text); display: block; }

.start { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.start-card { max-width: 560px; }
.start-card p { margin: 0; color: var(--text-2); }
.start-card .btn { align-self: flex-start; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: min(560px, calc(100vw - 32px)); padding: 12px 18px; border-radius: 12px; background: #24332c; border: 1px solid #4f7a6c; box-shadow: 0 12px 30px rgba(0,0,0,.4); z-index: 60; }
.toast.err { background: #321c1a; border-color: #7a3a34; }

/* ---------- Notizen ---------- */
.notebtn { display: inline-flex; align-items: center; gap: 5px; min-height: 36px; min-width: 36px; justify-content: center; padding: 0 10px; border-radius: 999px; border: 1px dashed var(--line-2); background: none; color: var(--muted); font-size: 13px; white-space: nowrap; }
.notebtn:hover { color: var(--text); border-color: #56685e; }
.notebtn.has { border-style: solid; border-color: #4a5f8a; color: #b8c8f0; background: #1b2236; }
.nb-label:empty { display: none; }
.nb-count { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #34406a; color: #dfe6ff; font-size: 12px; font-weight: 700; }
.nb-count.open { background: #5a4520; color: var(--gold-text); }
.notestoggle { gap: 6px; padding: 0 12px; }
.notestoggle.on { background: #1b2236; border-color: #4a5f8a; color: #dfe6ff; }
.navnotes { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; color: #b8c8f0; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 0; border-radius: 8px; background: none; color: var(--muted); }
.iconbtn:hover { background: var(--surface-2); color: var(--text); }
.npc-head { display: flex; align-items: center; gap: 6px; }

.attached { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.readaloud .attached { margin-bottom: 14px; }
.unit-notes:has(.attached) { padding: 0 12px 10px; }
.note { border-radius: 10px; border: 1px solid #333f5c; background: #171d2c; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }

.who { padding: 2px 8px; border-radius: 999px; background: #22302a; color: var(--teal); font-weight: 600; }

.threadbtn.on { border-color: #4f7a6c; color: #9fe0cf; }
.placebtn { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; min-height: 30px; padding: 0 2px; border: 0; background: none; color: var(--gold); font-size: 13px; font-weight: 600; text-align: left; }
.linkbtn.plain { margin: 0; padding: 0; color: var(--text); text-decoration: none; font: inherit; }

.pcname { display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: none; text-align: left; text-decoration: underline; text-decoration-color: #4a5a52; text-underline-offset: 3px; }
.pctable .notecell { width: 40px; padding: 2px 4px; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px var(--gold); } 100% { box-shadow: 0 0 0 3px transparent; } }

.fab { position: fixed; right: max(20px, calc(var(--sar) + 12px)); bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 45; display: inline-flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 20px; border-radius: 999px; border: 0; background: #4a5f8a; color: #fff; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.45); }

.main { padding-bottom: 110px; }

.sheet-wrap { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; padding: calc(16px + var(--sat)) max(16px, var(--sar)) calc(16px + var(--sab)) max(16px, var(--sal)); }
.sheet { width: min(620px, 100%); max-height: calc(100dvh - 32px - var(--sat) - var(--sab)); overflow: auto; border-radius: 16px; border: 1px solid var(--line-2); background: #18241f; box-shadow: 0 20px 50px rgba(0,0,0,.5); padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
@media (min-width: 861px) { .sheet-wrap { align-items: center; } }
.sheet-head { display: flex; align-items: center; gap: 8px; }
.sheet-head h2 { font-size: 22px; }
.sheet textarea { font-size: 17px; min-height: 110px; }
.chipgroup { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.chipgroup .eyebrow { width: 100%; }
.togglechip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px dashed var(--line-2); background: none; color: var(--muted); font-weight: 700; font-size: 14px; }
.togglechip.on { border-style: solid; border-color: currentColor; }
.togglechip.who.on { color: var(--teal); background: #1c2e28; }
.togglechip.tag { background: none; }
.togglechip.tag.on.t-gesagt { color: #b8c8f0; background: #1b2236; }
.togglechip.tag.on.t-getan { color: var(--good); background: #1f2b20; }
.togglechip.tag.on.t-idee { color: var(--fear-text); background: #2a2140; }
.togglechip.tag.on.t-faden { color: var(--gold-text); background: #3a2e14; }
.togglechip.tag.on.t-nsc { color: var(--warn); background: #2d2019; }
.togglechip.tag.on.t-regel { color: #c9cfc4; background: #262c29; }
.togglechip:not(.tag):not(.who).on { color: var(--gold-text); background: #3a2e14; }
.sheet-foot { display: flex; align-items: center; gap: 8px; }

.filters input[type=search] { width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: #101713; }
.note-group { display: flex; flex-direction: column; gap: 8px; }
.group-title { font-size: 20px; }
.empty { color: var(--muted); }
.threads .note { gap: 4px; }

/* ---------- Schmalere Bildschirme ---------- */
@media (max-width: 1180px) {
  .body { grid-template-columns: 240px minmax(0, 1fr); height: auto; }
  .nav { position: sticky; top: var(--hdr); height: calc(100dvh - var(--hdr)); }
  .main { overflow: visible; }
  .side { grid-column: 2; border-left: 0; border-top: 1px solid #2a3832; overflow: visible; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); padding: 24px 36px 60px; }
}
@media (max-width: 860px) {
  .body { display: block; }
  .nav { position: fixed; top: var(--hdr); left: 0; bottom: 0; width: min(320px, 86vw); height: auto; z-index: 40; background: var(--bg-2); border-right: 1px solid var(--line-2); transform: translateX(-100%); transition: transform .2s; }
  .nav-open .nav { transform: none; }
  .nav-open .scrim { display: block; position: fixed; inset: var(--hdr) 0 0 0; background: rgba(0,0,0,.5); z-index: 35; }
  .main { padding: 20px 16px 40px; }
  .side { padding: 20px 16px 40px; }
  .unit-body { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  h1 { font-size: 28px; }
  .topbar { gap: 10px; padding: 8px 12px; flex-wrap: wrap; }
  .brand { flex: 1; }
  .brand .eyebrow { display: none; }
  .brand-title { font-size: 18px; white-space: normal; line-height: 1.2; }
  .fear { order: 5; width: 100%; justify-content: space-between; }
  .nt-label { display: none; }
  .fab > span:not(.ic) { display: none; }
  .brand { display: none; }
  .prevnext { order: 0; }
  .topbar > .grow { order: 1; }
  .notestoggle, .menu { order: 2; }
  .fab { padding: 0; width: 56px; justify-content: center; }
  .fdot { width: 19px; }
  .fdot span { width: 13px; height: 13px; }
  .outcomes { grid-template-columns: minmax(0, 1fr); }
  .readtext { font-size: 18px; }
  .readaloud { padding: 6px 16px; }
  .gmnote { flex-direction: column; gap: 6px; }
  .unit-head { gap: 8px; }
  .actbtn { flex: 1; justify-content: center; }
  .dmgbtns { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); }
  }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.side { padding-bottom: 110px; }
@media (hover: none) { .kbd-hint { visibility: hidden; } }

/* ---------- Blättern in der Kopfleiste ---------- */
.prevnext { display: flex; gap: 6px; }
.btn.pn { min-height: 44px; padding: 0 12px; gap: 4px; }
.btn.pn:disabled { opacity: .35; cursor: default; }

/* ---------- Kampf-Bildschirm ---------- */
.combat-body { display: block; height: calc(100dvh - var(--hdr)); }

.cs-title { font-size: 24px; }
.cs-strip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pcstrip { display: flex; gap: 6px; flex-wrap: wrap; }
.pcchip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; }
.pcchip-name { color: var(--text-2); }

.cs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; align-items: start; }
.cscreen .unit.open { grid-column: 1 / -1; }
.cscreen .unit-head { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "name note act" "tracks tracks tracks" "chips chips chips"; gap: 2px 8px; padding: 6px 10px 8px; }
.cscreen .unit-name { grid-area: name; min-height: 40px; }

.cscreen .pip { width: 30px; height: 34px; }

.cscreen .spawnrow { margin-top: 2px; }
@media (max-width: 640px) {
  .pn-label { display: none; }
  .btn.pn { width: 44px; padding: 0; }

  .cs-main { height: auto; padding: 12px 12px 90px; }
  .cs-grid { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- Update-Hinweis & Menü ---------- */
.updatebar { position: fixed; left: 50%; top: calc(var(--hdr) + 8px); transform: translateX(-50%); z-index: 65; width: min(560px, calc(100vw - 24px)); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-radius: 14px; background: #24332c; border: 1px solid var(--gold); box-shadow: 0 14px 34px rgba(0,0,0,.45); }
.ub-text { flex: 1 1 200px; display: flex; flex-direction: column; }
.menu-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.menu-item.accent { color: var(--gold); font-weight: 700; }
.menu-version { padding: 6px 10px 4px; font-size: 12px; color: var(--muted); }
.verbadge { position: absolute; top: calc(var(--sat) + 2px); right: 10px; font-size: 10px; line-height: 1; color: #7f8a83; font-variant-numeric: tabular-nums; pointer-events: none; user-select: none; }
@media (max-width: 640px) { .topbar { padding-top: calc(16px + var(--sat)); } .verbadge { top: calc(var(--sat) + 3px); } }
@media (max-width: 1180px) and (min-width: 641px) {
  .brand .eyebrow, .fear-label { display: none; }
  .fdot { width: 19px; }
  .fdot span { width: 13px; height: 13px; }
  .topbar { gap: 12px; }
}

/* ---------- Countdown ---------- */
.countdown { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 14px; border-radius: 14px; background: #2a2414; border: 1px solid #6b5527; }
.cd-main { display: grid; grid-template-columns: auto auto; grid-template-areas: "label label" "value dots"; align-items: center; column-gap: 12px; row-gap: 2px; }
.cd-label { grid-area: label; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--gold-text); }
.cd-value { grid-area: value; display: inline-flex; align-items: baseline; gap: 4px; font-family: var(--serif); }
.cd-value strong { font-size: 30px; line-height: 1; color: var(--gold-text); }
.cd-max { font-size: 15px; color: var(--muted); }
.cd-dots { grid-area: dots; display: inline-flex; gap: 4px; flex-wrap: wrap; }
.cd-dot { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid #8a6a2c; transform: rotate(45deg); }
.cd-dot.on { background: var(--gold); border-color: var(--gold); }
.cd-btns { display: flex; gap: 6px; }
.cd-rules { flex: 1 1 100%; color: var(--text-2); }
.cd-done { flex: 1 1 100%; color: var(--good); font-weight: 700; }
.countdown.finished { border-color: #4f7a6c; background: #1c2e28; }
.countdown.compact { padding: 6px 10px; gap: 10px; }
.countdown.compact .cd-value strong { font-size: 24px; }
.countdown.compact .btn.icon { width: 40px; min-height: 40px; }
.countdown.compact .cd-done { font-size: 13px; }

/* ---------- Aufklappbare Effekte im Kampf-Bildschirm ---------- */
.extra-chip { cursor: pointer; color: var(--text); }
.extra-chip.ally { border-color: #4f7a6c; }
.extra-chip.env { border-color: #6a52a0; }
.extra-chip.open { background: var(--surface-2); }
.extra-chip .chev { margin-left: 2px; }
.extra-panel { padding: 12px 14px; gap: 8px; }
.extra-panel.env { border-color: #6a52a0; }
.extra-panel.ally { border-color: #4f7a6c; }
.extra-panel .env-btn { align-self: flex-start; }

/* ---------- Kampf-Bildschirm: links Spieler, rechts Gegner ---------- */
.cs-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.cs-layout.three { grid-template-columns: minmax(0, 1fr) minmax(0, 0.7fr) minmax(0, 1fr); }
.cs-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cs-side-title { margin: 0; font-family: var(--sans); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; padding: 4px 2px 6px; border-bottom: 2px solid; }
.cs-friend .cs-side-title { color: var(--stress); border-color: var(--stress-off); }
.cs-neutral .cs-side-title { color: var(--muted); border-color: var(--line-2); }
.cs-foe .cs-side-title { color: var(--hp); border-color: var(--hp-off); }
.cs-top { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.cs-top > * { flex: 1 1 280px; }
.cs-top .countdown { flex-direction: row; }
.cs-top .countdown .cd-main { flex: 1; }
.cs-top .cd-dot { width: 10px; height: 10px; }
.cs-layout.three .cs-right .cs-grid, .cs-layout.three .groups { grid-template-columns: minmax(0, 1fr); }
/* Spielercharakter-Karte */
.cpc { border: 1px solid var(--line); border-left: 3px solid var(--stress-off); border-radius: 12px; background: var(--surface); padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
.cpc-head { display: flex; align-items: center; gap: 6px; }
.cpc-toggle { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 40px; padding: 0; border: 0; background: none; text-align: left; color: inherit; }
.cpc-name { flex: 1; display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.cpc-name strong { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cpc-name .small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cpc-stats { display: flex; gap: 6px; flex-wrap: wrap; }
.cpc-stat { display: flex; flex-direction: column; align-items: center; min-width: 52px; padding: 3px 6px; border-radius: 8px; background: var(--surface-2); }

.cpc-weapon { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: 14px; }
.cpc-wlabel { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); min-width: 56px; }
.cpc-weapon .dmg { color: var(--gold-text); }
.cpc-more { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; border-top: 1px solid var(--line); }
.cpc-traits { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.cpc-traits span { display: flex; flex-direction: column; align-items: center; padding: 2px; border-radius: 6px; background: var(--surface-2); }
.cpc-traits em { font-style: normal; font-size: 10px; color: var(--muted); }
.cpc-traits strong { font-family: var(--serif); }
.cpc-feats { display: flex; flex-direction: column; gap: 6px; }

.cs-right { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.cs-pcs { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 10px; }
.cs-pcs .eyebrow { padding: 0 4px 4px; font-size: 11px; }
.cs-pc { display: grid; grid-template-columns: minmax(0, 1fr) auto 52px 36px; align-items: center; gap: 6px; padding: 4px 4px; border-top: 1px solid #22302a; }
.cs-pc:first-of-type { border-top: 0; }
.cs-pc-name { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.cs-pc-name strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.cs-extras { display: flex; flex-direction: column; gap: 6px; }
.cs-extra { border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }

.cs-extra.env { border-color: #6a52a0; }
.cs-extra-head { width: 100%; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border: 0; background: none; text-align: left; }

.cs-extra-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 6px; }

  .cs-layout, .cs-layout.three { grid-template-columns: minmax(0, 1fr); }
}

html.ios-standalone { --sat: max(env(safe-area-inset-top, 0px), 24px); }

/* ---------- Kampagnen-Notizen ---------- */
.segmented { display: inline-flex; align-self: flex-start; padding: 3px; border-radius: 12px; background: #101713; border: 1px solid var(--line-2); }
.segmented button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 9px; background: none; color: var(--muted); font-weight: 700; }

.note.foreign { border-style: dashed; }
.note-adv { display: flex; flex-direction: column; gap: 14px; }
.adv-title { display: flex; align-items: center; gap: 8px; font-size: 22px; padding-top: 6px; border-top: 1px solid var(--line); }

/* ---------- Gegnergruppen (wie im Abenteuerbuch) ---------- */
.groups { display: flex; flex-direction: column; gap: 12px; }
.group-card { border: 1px solid var(--line-2); border-radius: 14px; background: #16201b; overflow: hidden; }

.gc-head { display: flex; align-items: center; gap: 8px; padding: 2px 10px; background: #22302a; }

.gc-title { display: flex; flex-direction: column; line-height: 1.25; }
.gc-title strong { font-family: var(--serif); font-size: 19px; }
.gc-ref { font-weight: 500; color: var(--muted); font-size: 15px; }
.gc-stats { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.gs { display: inline-flex; align-items: baseline; gap: 6px; font-size: 14px; }

.gs strong { font-size: 16px; }
.gc-feats { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; width: 100%; min-height: 40px; padding: 6px 14px; border: 0; border-bottom: 1px solid var(--line); background: #1a1812; text-align: left; font-size: 14px; }
.gc-feat { color: var(--gold-text); font-weight: 600; }
.gc-more { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.gc-rows { display: flex; flex-direction: column; }
.unit-row { border-top: 1px solid #22302a; padding: 4px 10px 4px 6px; }
.unit-row:first-child { border-top: 0; }
.unit-row.down { opacity: .5; }
.unit-row.acted .ur-name strong { color: var(--muted); }
.unit-row.open { background: var(--surface); }

/* ---------- Schnell ausblenden ---------- */

.toast-action { min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--gold); background: none; color: var(--gold-text); font-weight: 700; }

/* ---------- Notiz-Knopf geteilt: neu | alle ansehen ---------- */

/* ---------- Tracker (Countdowns, Würfelpool, Ziel, Stufen) ---------- */

/* ---------- Handouts ---------- */

/* ---------- Charaktererschaffung ---------- */
.creator { display: flex; flex-direction: column; gap: 12px; padding: 16px max(16px, var(--sar)) calc(32px + var(--sab)) max(16px, var(--sal)); max-width: 1400px; margin: 0 auto; width: 100%; }
.cr-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cr-pcs { display: flex; gap: 6px; flex-wrap: wrap; }
.chipbtn { display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text-2); font-size: 14px; font-weight: 600; }
.chipbtn.on { background: var(--gold); border-color: var(--gold); color: #1a140a; }
.chip.soft { font-weight: 500; font-size: 14px; }
.cr-steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.cr-step { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px 0 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 14px; font-weight: 600; }
.cr-step.on { border-color: var(--gold); color: var(--text); background: var(--gold-bg); }
.cr-step.done { color: var(--text-2); }
.cr-num { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); font-size: 13px; }

.cr-step.done:not(.on) .cr-num { background: #2a3f38; color: var(--good); }
.cr-layout { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
.cr-help { position: sticky; top: calc(var(--hdr) + 8px); display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: #182420; }
.cr-help h2 { font-size: 22px; }
.cr-help .prose p { margin: 0 0 8px; }
.cr-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.cr-stack { display: flex; flex-direction: column; gap: 12px; }
.cr-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.cr-grid.two { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.cr-card { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); text-align: left; min-height: 44px; }
.cr-card.small { padding: 10px 12px; }
.cr-card:hover { border-color: #56685e; }
.cr-card.on { border-color: var(--gold); background: var(--gold-bg); box-shadow: 0 0 0 1px var(--gold) inset; }
.cr-card-title { font-family: var(--serif); font-size: 18px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.cr-card-sub { font-size: 13px; color: var(--teal); }
.cr-card-stats { font-size: 13px; color: var(--text-2); }
.cr-card-hint { font-size: 13px; color: var(--muted); }
.cr-detail .feature.hope { border-color: var(--gold-line); }
.cr-toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; font-size: 14px; }
.cr-toggle input { width: 20px; height: 20px; accent-color: var(--gold); }
.cr-traits { display: flex; flex-direction: column; gap: 8px; }
.cr-trait { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.cr-trait-name { flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px; }
.cr-trait-name strong { font-size: 17px; display: inline-flex; gap: 6px; align-items: center; }
.segmented.wrap { flex-wrap: wrap; }
.good { color: var(--good); }
.cr-values { width: 100%; border-collapse: collapse; }
.cr-values th, .cr-values td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.cr-values td.num strong { font-family: var(--serif); font-size: 22px; }
.cr-adj { display: inline-flex; gap: 4px; }
.cr-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px; }
.cr-row { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-align: left; }
.cr-row.on { border-color: var(--gold); background: var(--gold-bg); box-shadow: 0 0 0 1px var(--gold) inset; }
.cr-row.off { opacity: .4; cursor: not-allowed; }
.cr-row-main { display: inline-flex; gap: 6px; align-items: center; }
.cr-row-meta { font-size: 14px; color: var(--text-2); }
.cr-row-feat { font-size: 13px; color: var(--muted); }
.cr-choice { display: flex; flex-direction: column; gap: 6px; }
.cr-ex summary { cursor: pointer; min-height: 36px; display: flex; align-items: center; color: var(--text-2); font-weight: 600; }
.cr-ex .chips { padding: 4px 0 8px; }
.cr-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.cr-dcard { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 14px; border-radius: 12px; border: 1px solid #4d4170; background: #1d1a2a; text-align: left; }
.cr-dcard.on { border-color: var(--gold); background: var(--gold-bg); box-shadow: 0 0 0 1px var(--gold) inset; }
.cr-dcard-head { display: flex; flex-direction: column; gap: 2px; }
.cr-dcard-head strong { font-family: var(--serif); font-size: 17px; }

.cr-conn { gap: 8px; }
.cr-summary { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }

.cr-sum-stats, .cr-sum-traits { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 4px; }
.cr-sum-stats span, .cr-sum-traits span { display: flex; flex-direction: column; align-items: center; padding: 4px; border-radius: 8px; background: var(--surface); }

.cr-open { align-self: flex-start; margin-top: 4px; }
/* Bogen */
.pc-sheet { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 14px; background: #f3efe4; color: #1e1a14; }
.pc-sheet h2 { font-size: 26px; }

.pcs-qa .prose p { margin: 0 0 6px; }
@media (max-width: 860px) {
  .cr-layout { grid-template-columns: 1fr; }
  .cr-help { position: static; }
  .cr-form { grid-template-columns: 1fr; }

}
@media print {

  html.print-pc .creator { padding: 0; }
  html.print-pc .pc-sheet { background: #fff; padding: 0; font-size: 11pt; }

}

.cr-sug { padding: 10px 12px; border-radius: 12px; background: var(--gold-bg); border: 1px solid var(--gold-line); }

.cr-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }

.cr-table tbody tr { cursor: pointer; }

.cr-table td.dmg { color: var(--gold-text); font-weight: 700; white-space: nowrap; }

.cr-pick { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0; border: 0; background: none; font-weight: 700; text-align: left; flex-wrap: wrap; }

.cr-radio { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex: 0 0 20px; border-radius: 50%; border: 1.5px solid var(--line-2); }

.cr-pick { display: grid; grid-template-columns: 20px auto; column-gap: 8px; row-gap: 2px; align-items: center; justify-items: start; }

/* Ausgewählte Ausrüstung wie auf dem Charakterbogen */

.ag-block { display: flex; flex-direction: column; gap: 6px; }
.ag-title { display: flex; align-items: center; gap: 10px; justify-content: space-between; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-text); border-bottom: 1px solid var(--gold-line); padding-bottom: 4px; }
.ag-prof { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; letter-spacing: .04em; text-transform: none; color: var(--text-2); }
.ag-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--gold-line); }
.ag-dot.on { background: var(--gold); border-color: var(--gold); }
.ag-row { display: grid; grid-template-columns: 74px 1.2fr 1.1fr .8fr 2fr 36px; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; background: var(--surface); }
.ag-row.empty { grid-template-columns: 74px 1fr; }
.ag-kind { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.ag-cell { display: flex; flex-direction: column; gap: 1px; font-size: 14px; min-width: 0; }
.ag-cell em { font-style: normal; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.ag-cell .dmg { color: var(--gold-text); }
.ag-thr { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: stretch; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; }
.ag-t { display: flex; flex-direction: column; justify-content: center; padding: 6px 10px; background: var(--surface); }
.ag-t strong { font-size: 13px; }
.ag-t em { font-style: normal; font-size: 11px; color: var(--muted); }
.ag-num { display: flex; align-items: center; justify-content: center; min-width: 48px; padding: 0 8px; font-family: var(--serif); font-size: 22px; font-weight: 700; background: var(--gold-bg); color: var(--gold-text); border-left: 1px solid var(--line-2); border-right: 1px solid var(--line-2); }
.ag-shields { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ag-shields span { display: flex; flex-direction: column; align-items: center; padding: 4px; border-radius: 8px; background: var(--surface); }
.ag-shields em { font-style: normal; font-size: 11px; color: var(--muted); }
.ag-shields strong { font-family: var(--serif); font-size: 20px; }
@media (max-width: 860px) {
  .ag-row { grid-template-columns: 1fr 1fr 36px; }
  .ag-row .ag-kind { grid-column: 1 / -1; }
  .ag-row .ag-cell.wide { grid-column: 1 / 3; }
  .ag-thr { grid-template-columns: 1fr auto 1fr auto 1fr; font-size: 12px; }
}
.ag-title .small { text-transform: none; letter-spacing: 0; font-weight: 400; }
@media (max-width: 860px) {
  .ag-row { grid-template-columns: 1fr 1fr; }
  .ag-row .ag-kind { grid-column: 1; grid-row: 1; }
  .ag-row .iconbtn { grid-column: 2; grid-row: 1; justify-self: end; }
  .ag-row .ag-cell.wide { grid-column: 1 / -1; }
  .ag-row.empty .ag-cell.wide { grid-column: 1 / -1; }
}

/* ---- Darstellung umschalten: App / Charakterbogen ---- */
.look-switch button { min-height: 32px; padding: 0 10px; font-size: 13px; }
.look-global-label { white-space: nowrap; }
.look-box { display: flex; flex-direction: column; gap: 8px; }
.look-head { display: flex; align-items: center; gap: 8px; }
.look-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.look-sheet {
  --surface: #fbf8f0; --surface-2: #efe8d8; --line: #c9bfa6; --line-2: #b5a98a;
  --text: #1e1a14; --text-2: #3a342a; --muted: #6f6a5e;
  --gold: #8a6a2c; --gold-text: #6b4e1d; --gold-bg: #f1e3c2; --gold-line: #b8975a;
  --hp: #b0442e; --stress: #2f7d72;
  color-scheme: light;
  background: #f3efe4; color: var(--text); padding: 12px; border-radius: 14px; border: 1px solid #c9bfa6;
}
.look-sheet .look-title { color: #6b4e1d; }
.look-sheet .segmented { background: #e6dec9; }
.look-sheet .active-gear { background: transparent; border: 0; padding: 0; }
.look-sheet .cr-summary { border-top: 0; padding-top: 0; }
.look-sheet .cr-summary strong, .look-sheet .cr-sum-stats strong { font-family: var(--serif); }
.look-sheet input { background: #fffdf7; color: var(--text); border-color: var(--line-2); }
.look-sheet .cr-values th, .look-sheet .cr-values td { border-color: var(--line); }
.look-sheet .btn { color: var(--text); border-color: var(--line-2); background: var(--surface); }
.look-sheet .pc-sheet { padding: 6px; background: transparent; }

/* Attribute wie auf dem Bogen */
.sheet-traits { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.st-box { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border: 2px solid #b5a98a; border-radius: 12px 12px 28px 28px; background: #fffdf7; text-align: center; }
.st-name { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #6b4e1d; }
.st-val { font-family: var(--serif); font-size: 30px; font-weight: 700; min-height: 40px; line-height: 40px; }
.st-verbs { display: flex; flex-direction: column; font-size: 11px; color: #6f6a5e; line-height: 1.25; }
.st-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-top: 4px; width: 100%; }
.st-pick button { min-height: 32px; border: 1px solid #c9bfa6; border-radius: 6px; background: #f6f1e4; color: #3a342a; font-weight: 700; font-size: 13px; }
.st-pick button.on { background: #6b4e1d; color: #fff; border-color: #6b4e1d; }

/* Werte wie auf dem Bogen */
.sheet-values { display: flex; flex-direction: column; gap: 12px; }
.sv-top { display: flex; gap: 12px; flex-wrap: wrap; }
.sv-shield { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 120px; padding: 10px 14px 18px; border: 2px solid #b5a98a; border-radius: 12px 12px 50% 50% / 12px 12px 30% 30%; background: #fffdf7; }
.sv-shield strong { font-family: var(--serif); font-size: 32px; line-height: 1; }
.sv-label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #6b4e1d; }
.sv-sec { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid #c9bfa6; border-radius: 10px; background: #fffdf7; }
.sv-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sv-l { min-width: 52px; font-weight: 800; font-size: 13px; text-transform: uppercase; }
.sv-row { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.sv-pip { width: 18px; height: 18px; border: 2px solid #8f846b; border-radius: 4px; background: #fff; }
.sv-pip.armor { border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%; }
.sv-pip.hope { transform: rotate(45deg); width: 15px; height: 15px; margin: 2px; border-radius: 2px; }
.sv-pip.hope.on { background: #8a6a2c; border-color: #6b4e1d; }

/* Erfahrungen wie auf dem Bogen */
.sheet-exp { display: flex; flex-direction: column; gap: 6px; }
.se-line { display: flex; align-items: center; gap: 8px; border-bottom: 1.5px solid #8f846b; }
.se-line input { flex: 1; border: 0 !important; background: transparent !important; font-family: var(--serif); font-size: 18px; padding: 6px 2px; }
.se-mod { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 30px; border: 1.5px solid #8f846b; border-radius: 6px; font-weight: 800; }

/* Bogen im App-Look */
.pc-sheet.app { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
.pc-sheet.app h3 { color: var(--gold-text); }
.pc-sheet.app .muted, .pc-sheet.app .pcs-stats em, .pc-sheet.app .pcs-traits em, .pc-sheet.app .pcs-qa em { color: var(--muted); }
.pc-sheet.app .pcs-stats span, .pc-sheet.app .pcs-traits span { border-color: var(--line-2); }

@media (max-width: 860px) {
  .sheet-traits { grid-template-columns: repeat(3, 1fr); }
  .look-global-label { display: none; }
}
@media print { .look-switch, .look-head { display: none !important; } .look-sheet { border: 0; padding: 0; background: #fff; } }

/* ---- Bogen-Look mit den echten Bogen-Grafiken ---- */
.sa-stack { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.sheet-art { position: relative; container-type: inline-size; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 0 #c9bfa6, 0 0 0 1px #d8cfb8; flex: none; }
.sa-img { position: absolute; display: block; max-width: none; pointer-events: none; user-select: none; -webkit-user-select: none; }
.sa-layer { position: absolute; inset: 0; }

.sa-t.center { justify-content: center; align-items: center; text-align: center; }
.sa-t.strong { font-weight: 700; }
.sa-t.big { font-family: var(--serif); font-weight: 700; }
.sa-box { position: absolute; border: .25cqw solid #4a4a4a; border-radius: .5cqw; background: #fff; }
.sa-diamond { position: absolute; background: #1f3358; transform: rotate(45deg) scale(.82); border-radius: 1px; }
.sa-coin { position: absolute; border-radius: 50%; background: #1f3358; opacity: .85; }
.sa-hit { position: absolute; border: 0; padding: 0; background: transparent; border-radius: 10px; cursor: pointer; }
.sa-hit.on { outline: 3px solid #b8975a; outline-offset: -2px; background: rgba(184, 151, 90, .12); }
.look-sheet .sa-input, .sa-input { position: absolute; margin: 0; padding: 0 .3em; border: 0; border-radius: 0; background: transparent; color: #1f3358; font-family: var(--sans); font-weight: 500; line-height: 1; min-height: 0; box-shadow: none; }
.sa-input:focus { outline: none; background: rgba(184, 151, 90, .15); }
.sa-pick { align-items: center; }
.sa-adjust { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 14px; }
.sa-adjust > span { display: inline-flex; align-items: center; gap: 6px; }
.sa-sumhead { display: flex; flex-direction: column; }
.sa-sumhead strong { font-family: var(--serif); font-size: 18px; }
.sa-sumhead span { font-size: 13px; color: var(--muted); }
.cr-help .sheet-art { width: 100% !important; }
.sa-full { display: flex; flex-direction: column; gap: 14px; }
.sa-full .sheet-art { width: 100% !important; }
.pc-sheet.rest { padding: 6px 0 0; }
.sheet-art, .sheet-art * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.sa-t.wrap { white-space: normal; align-items: flex-start; line-height: 1.25; text-overflow: clip; }
.sa-t.big { line-height: 1; padding-top: .1em; }
.sa-ring { position: absolute; border: .22cqw solid #1f3358; border-radius: 50%; pointer-events: none; }
.sa-dot { position: absolute; border-radius: 50%; background: #1f3358; }
.sa-mark { position: absolute; border-radius: 2px; background: #1f3358; opacity: .85; }

/* ---- Bogen-Update prüfen ---- */
.cu-body { max-width: 860px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.cu-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.cu-head select { min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text); font-size: 16px; }
.cu-warn { color: var(--warn); flex-basis: 100%; }

.cu-table th { font-weight: 600; width: 30%; }

/* Mitzählen im Kampf (Spielercharaktere) */
.cpc-track { display: flex; flex-direction: column; gap: 2px; }
.cpc-trow { display: flex; align-items: center; gap: 6px; }
.cpc-tl { width: 62px; flex: none; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

.cpc-pips { display: flex; flex-wrap: wrap; }
.cscreen .cpc .pip { width: 25px; height: 32px; }
.cscreen .cpc .pip span { width: 18px; height: 18px; }

.pip.hope.on span { background: var(--gold); border-color: var(--gold); }
.pip.armor span { border-radius: 50% 50% 45% 45% / 35% 35% 65% 65%; border-color: #6b7a8a; }
.pip.armor.on span { background: #9fb3c8; border-color: #9fb3c8; }
.cpc-down { color: var(--bad); font-weight: 700; }
.cpc-dmg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
.cpc-dmg input { width: 84px; min-height: 36px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text); font-size: 16px; }

/* ---- Kampf-Bildschirm kompakt: zwei Hälften, alles auf einen Blick ---- */

.cs-bar { gap: 8px; }
.cs-bar .cs-title { font-size: 22px; }
.cs-top { margin-bottom: 4px; }
.cs-side { gap: 8px; }
.cs-side-title { padding: 0 2px 3px; font-size: 11px; }

/* Gegner etwas dichter */
.cscreen .gc-toggle { min-height: 40px; }
.cscreen .gc-title strong { font-size: 17px; }

.cscreen .spawnrow .btn { min-height: 34px; }
/* Auf großen Bildschirmen scrollt jede Seite für sich, die Seite selbst nicht */

  .cs-side { max-height: calc(100dvh - var(--hdr) - 118px); overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; }
  .cs-side-title { position: sticky; top: 0; z-index: 1; background: var(--bg); }
}

/* ---- Gruppe verwalten ---- */

.cr-rename { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 8px 12px; }

@media (max-width: 600px) { .cr-rename-row { grid-template-columns: minmax(0, 1fr); } }
@media print { .cr-rename { display: none !important; } }

/* ---- Domänenkarten-Bogen (Stil der Charakterbögen) ---- */

.ds-foot .btn { color: #333; border-color: #bbb; background: #f4f4f4; }
.ds-legal { margin-left: auto; font-size: 10px; font-style: italic; color: #777; }
@media (max-width: 700px) { .ds-cols { grid-template-columns: 1fr; } .ds-head { grid-template-columns: 1fr; } .ds-band { clip-path: none; } }
@media print { .ds-more { display: none !important; } .dsheet { box-shadow: none; break-before: page; } .ds-card { break-inside: avoid; } }
.sa-x { position: absolute; display: flex; align-items: center; justify-content: center; color: #1f3358; font-weight: 900; line-height: 1; pointer-events: none; }
.sa-hit.box { border-radius: 3px; }
.sa-hit.box:hover, .sa-hit.box:focus-visible { background: rgba(31, 51, 88, .08); outline: none; }
@media print { .sa-hit { display: none; } }

/* ---- Sonderbögen im App-Look ---- */
.sp { display: flex; flex-direction: column; gap: 16px; }
.sp-sec { display: flex; flex-direction: column; gap: 10px; }
.sp-h { margin: 0; font-size: 18px; }
.sp-group { display: flex; flex-direction: column; gap: 6px; }
.sp-opts { display: flex; flex-direction: column; gap: 4px; }
.sp-opt { display: grid; grid-template-columns: 96px 1fr; gap: 8px; align-items: start; padding: 4px 0; border-bottom: 1px solid var(--line); }
.sp-opt.on .sp-text { color: var(--text); }
.sp-text { font-size: 14px; color: var(--text-2); }
.sp-boxes { display: inline-flex; gap: 4px; justify-content: flex-end; }
.sp-box { width: 28px; height: 28px; padding: 0; border: 2px solid var(--line-2); border-radius: 5px; background: var(--surface-2); color: var(--gold-text); font-weight: 900; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; }
.sp-box.on { border-color: var(--gold); background: var(--gold-bg); }
.sp-forms { display: flex; flex-wrap: wrap; gap: 6px; }
.sp-form { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 10px 4px 6px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); color: var(--text); font-weight: 600; }
.sp-form.on { border-color: var(--gold); }
.sp-big { font-family: var(--serif); font-size: 26px; }
.sp-exp { display: grid; grid-template-columns: 1fr 72px; gap: 6px; }
.sp-exp input { min-height: 38px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text); font-size: 16px; }
@media print { .sp-wrap { display: none !important; } }
.sa-input.center { text-align: center; padding: 0; } .sa-input.strong { font-weight: 700; }
.sa-input::placeholder { color: #b9c0cc; } @media print { .sa-input::placeholder { color: transparent; } }

/* ---- Bogen-Ansicht (fertige Charaktere) ---- */
.pcview { display: flex; flex-direction: column; gap: 12px; max-width: 960px; margin: 0 auto; width: 100%; }
.pv-pages { display: flex; flex-direction: column; gap: 14px; }
.pv-help { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border: 1px solid var(--gold-line); border-radius: 12px; background: var(--gold-bg); }
.pv-help p { margin: 0; }
.pv-over { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.pv-ov { display: inline-flex; align-items: center; gap: 6px; }
.sa-input.edit { background: rgba(255, 236, 170, .28); border-bottom: 1px dashed rgba(31, 51, 88, .35); }
.sa-input.edit:focus { background: rgba(255, 236, 170, .6); }
.sa-input.big { font-family: var(--serif); font-weight: 700; text-align: center; padding: 0; }
@media print {
  html.print-pc .app > .pcview { display: block !important; max-width: none; }
  html.print-pc .pv-bar, html.print-pc .pv-help { display: none !important; }
  html.print-pc .pcview .sheet-art { width: 100% !important; break-after: page; box-shadow: none; }
  .sa-input.edit { background: transparent !important; border: 0 !important; }
}
/* Eingaben auf dem Bogen: keine App-Eingabefeld-Optik */
.sheet-art input.sa-input { min-height: 0 !important; height: auto; margin: 0; padding: 0 .25em; border: 0; border-radius: 2px; box-shadow: none; background: transparent; color: #1f3358; line-height: 1; -webkit-appearance: none; appearance: none; }
.sheet-art input.sa-input.center { padding: 0; }
.sheet-art input.sa-input.edit { background: rgba(255, 228, 140, .22); border-bottom: 1px dashed rgba(31, 51, 88, .35); }
.sheet-art input.sa-input:focus { outline: none; background: rgba(255, 228, 140, .55); }

/* ---- Stufenaufstieg ---- */
.lu { display: flex; flex-direction: column; gap: 14px; max-width: 900px; margin: 0 auto; width: 100%; }
.lu-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.lu-step { font-family: var(--serif); font-size: 26px; }
.lu-step strong { color: var(--gold-text); }
.lu-warn { margin: 0; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--gold-line); background: var(--gold-bg); color: var(--warn); }
.lu-sec { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.lu-sec h3 { margin: 0; display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 20px; }
.lu-sec p { margin: 0; }
.lu-n { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 50%; background: var(--gold); color: #1a140a; font-family: var(--sans); font-size: 15px; font-weight: 800; flex: none; }
.lu-count { margin-left: auto; font-family: var(--sans); font-size: 15px; color: var(--gold-text); font-weight: 700; }
.lu-rank { display: flex; flex-direction: column; }
.lu-rank .eyebrow { margin: 6px 0 2px; }
.lu-opt { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.lu-opt:last-child { border-bottom: 0; }
.lu-opt.off .lu-text { color: var(--muted); }
.lu-opt.on .lu-text { color: var(--text); font-weight: 600; }
.lu-text { font-size: 14.5px; color: var(--text-2); }
.lu-boxes { display: inline-flex; gap: 4px; justify-content: flex-end; }
.lu-boxes.bold .lu-box { border-width: 3px; }
.lu-box { width: 24px; height: 24px; border: 2px solid var(--line-2); border-radius: 4px; background: var(--surface-2); display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: var(--muted); }
.lu-box.new { border-color: var(--gold); background: var(--gold-bg); color: var(--gold-text); }
.lu-act { display: inline-flex; gap: 6px; }
.lu-detail { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 10px; background: var(--bg-2); border: 1px solid var(--line); }
.lu-detail p { margin: 0; }
.lu-feat { font-size: 14.5px; }
.lu-feat .lu-ftext, .lu-feat .lu-ftext p { display: inline; margin: 0; }
.lu-cards { display: flex; flex-direction: column; gap: 4px; }
.lu-lvl { display: flex; flex-direction: column; gap: 2px; }
.lu-lvl .eyebrow { margin-top: 6px; }
.lu-card { display: grid; grid-template-columns: 28px 1fr; gap: 4px 10px; align-items: start; padding: 4px 0; }
.lu-card.had { opacity: .55; }
.lu-card.on .lu-cname strong { color: var(--gold-text); }
.lu-cname { text-align: left; background: none; border: 0; padding: 2px 0; color: var(--text); font: inherit; cursor: pointer; min-height: 28px; }
.lu-ctext { grid-column: 2; font-size: 14px; color: var(--text-2); }
.lu-ctext p { margin: 0 0 4px; }
.lu-foot { position: sticky; bottom: calc(8px + var(--sab)); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-radius: 14px; border: 1px solid var(--gold-line); background: var(--gold-bg); box-shadow: 0 6px 24px rgba(0,0,0,.4); }
.lu-todo { margin: 0; color: var(--warn); }
.lu-ok { margin: 0; color: var(--good); display: inline-flex; align-items: center; gap: 6px; }
.pv-last { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0; }
@media (max-width: 600px) { .lu-opt { grid-template-columns: 1fr auto; } .lu-opt .lu-boxes { grid-column: 1 / -1; justify-content: flex-start; } }
.lu-card .ds-box:disabled:not(.on) { opacity: .3; }
@media (max-width: 700px) { .lu { padding: 0 12px; box-sizing: border-box; } .pv-bar .cs-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .lu-step { font-size: 22px; } }
.gv-groups { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.gv-groups p { margin: 0; }
.gv-newgrp { display: flex; flex-direction: column; gap: 8px; }
.gv-delgrp { align-self: flex-start; }

/* ---- Ausrüstung, Karten, Rast ---- */
.gr { display: flex; flex-direction: column; gap: 14px; }
.gr-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.gr-row:last-of-type { border-bottom: 0; }
.gr .lu-sec > .gr-row:not(:has(.gr-kind)) { grid-template-columns: 1fr auto; }
.gr-kind { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.gr-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.gr-row.empty .gr-main { opacity: .8; }
.gr-act { display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.gr-count { color: var(--gold-text); }
.gr-danger { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text-2); }
.gr-danger input { width: 20px; height: 20px; }
.gr-search { flex: 1; min-width: 180px; }
.gr-list { display: flex; flex-direction: column; gap: 4px; max-height: 420px; overflow-y: auto; }
.gr-item { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
.gr-item:active { border-color: var(--gold); }
.gr-rolled { display: flex; flex-direction: column; gap: 4px; padding: 10px; border-radius: 10px; border: 1px solid var(--gold-line); background: var(--gold-bg); }
.gr-rolled .btn { align-self: flex-start; }
.gr-add { align-self: flex-start; }
.gr-golds { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.gr-gold { display: inline-flex; align-items: center; gap: 8px; }
.gr-gold strong { min-width: 1.5em; text-align: center; font-size: 18px; color: var(--gold-text); }
.cd-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cd-card { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.cd-card .lu-ctext { grid-column: 1 / -1; }
.rest-slot { display: flex; flex-direction: column; gap: 6px; padding: 6px 0; }
.rest-slot p { margin: 0; }
.rest-target { display: inline-flex; gap: 8px; align-items: center; }
.rest-log { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
@media (max-width: 700px) { .gr-row { grid-template-columns: 1fr; } .gr-act { justify-content: flex-start; } .cd-cols { grid-template-columns: 1fr; } }
.rest-moves summary { cursor: pointer; color: var(--gold-text); } .rest-moves p { margin: 4px 0; }
@media (max-width: 700px) { .pcview > .pv-bar { padding-left: 12px; padding-right: 12px; } }
.sheet-art textarea.sa-area { min-height: 0 !important; margin: 0; padding: .1em .25em; border: 0; border-radius: 2px; box-shadow: none; background: rgba(255, 228, 140, .18); color: #1f3358; line-height: 1.15; resize: none; overflow: auto; font-family: inherit; -webkit-appearance: none; appearance: none; }
.sheet-art textarea.sa-area:focus { outline: none; background: rgba(255, 228, 140, .5); }
.pv-entryhelp { margin: 0 0 6px; }

/* ---- Skizzen und Bilder ---- */
.pill.sketch { background: #3a3324; color: #f1d9a0; }
.pill.picture { background: #2c3340; color: #bcd2ee; }
.sk-wrap { border-radius: 10px; overflow: hidden; border: 1px solid #8a7a55; background: #e9e1c8; }
.sk-svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; font-family: var(--serif); }
.sk-svg.big { width: auto; height: 100%; max-width: 100%; margin: 0 auto; }
.sk-label { fill: #4a3f2a; font-style: italic; paint-order: stroke; stroke: rgba(255,250,235,.85); stroke-width: 0.25px; }
.sk-range { fill: #8a3a1a; font-family: var(--sans); paint-order: stroke; stroke: rgba(255,250,235,.9); stroke-width: 0.2px; }
.sk-tok { cursor: grab; }
.sk-tok:active { cursor: grabbing; }
.sk-ini { fill: #fff; font-family: var(--sans); font-weight: 800; pointer-events: none; }
.sk-name { fill: #2b2418; font-family: var(--sans); font-weight: 700; paint-order: stroke; stroke: rgba(255,250,235,.95); stroke-width: 0.28px; pointer-events: none; }
.sk-tok.sel circle:nth-of-type(2) { stroke: #ffd36b; stroke-width: 0.3; }
.sk-tok.down .sk-name { fill: #6b655c; }
.sk-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--text-2); }
.sk-key { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fbf6e8; }
.sk-key.pc { background: #3f6aa8; } .sk-key.foe { background: #7a2b25; } .sk-key.ally { background: #b8892a; }
.sketch-show .sks-body, .picture-show .sks-body { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 10px; }
.sketch-show .sk-svg.big { max-height: 100%; }
.pic-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.pic-body:not(:has(.pic-img)) { grid-template-columns: 1fr; }
.pic-img { width: 100%; border-radius: 10px; border: 1px solid var(--line-2); }
.pic-idea { display: flex; flex-direction: column; gap: 6px; }
.pic-full { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
@media (max-width: 700px) { .pic-body { grid-template-columns: 1fr; } }
@media print { .sketch-show .sks-body { display: block; padding: 0; } .sketch-show .sk-svg.big { width: 100%; height: auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; } }

/* ---------- Spieltisch (Owlbear) ---------- */
.tblstatus { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line-2); }
.tblstatus.ready { color: var(--teal); border-color: #3f6a60; background: #1d2f2a; }
.tblstatus.error { color: var(--bad); border-color: #8a4a3e; }
.tblbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; border: 1px dashed #3f6a60; border-radius: 12px; background: #172521; }
.tblbar.muted { border-color: var(--line-2); background: none; }
.tbl-title { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--teal); }
.tblbtn { display: inline-flex; align-items: center; gap: 5px; min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid #3f6a60; background: #1d2f2a; color: var(--teal); font-weight: 700; font-size: 14px; white-space: nowrap; }
.tblbtn:hover { background: #24392f; }
.tblbtn.hid { border-style: dashed; color: var(--muted); background: none; }
.tblbtn.on { border-color: #4f7a6c; }
.tblbtn.icononly { width: 40px; justify-content: center; padding: 0; }
.tblgrp { display: inline-flex; gap: 4px; }
.gc-head .tblbtn { min-height: 34px; margin-left: auto; }
.tblrange { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 13px; font-weight: 700; border: 1px solid var(--line-2); color: var(--text-2); white-space: nowrap; }
.tblrange.r-unmittelbar { color: var(--bad); border-color: #8a4a3e; background: #3b2420; }
.tblrange.r-sehrkurz { color: var(--warn); border-color: #7a5a3a; }
.tblrange.r-kurz { color: var(--gold-text); border-color: var(--gold-line); }
.tblpc { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 4px 0 2px; }
.tblowner select { min-height: 40px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text); font: inherit; font-size: 14px; }
.playerview { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 16px; }
.playerview .card { max-width: 480px; width: 100%; }
.playerview h1 { margin: 0; font-family: var(--serif); }
.playerview p { margin: 0; color: var(--text-2); }
.plv-list { display: flex; flex-direction: column; gap: 6px; }
.plv-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
@media (max-width: 640px) { .tblbtn .tbl-l { display: none; } .tblbtn { width: 40px; justify-content: center; padding: 0; } }
/* Im schmalen Kampf-Bildschirm nur Symbole */
.cscreen .unit-row .tblbtn .tbl-l { display: none; }
.cscreen .unit-row .tblbtn { width: 40px; justify-content: center; padding: 0; }
.tblstatus-wrap { display: inline-flex; align-items: center; gap: 4px; }
@media (max-width: 640px) { .tblstatus .tbl-st { display: none; } }
.tblbar { flex-direction: column; align-items: stretch; }
.tblbar.muted { flex-direction: row; align-items: center; }
.tblrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tblmap { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; min-width: 0; }
.tblmap strong { color: var(--text); }
.scene > .tblbar { margin: 4px 0 6px; }
</style>
